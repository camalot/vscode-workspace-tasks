[files]
extend-exclude = [
  "**/node_modules/**",
  "**/dist/**",
  "**/build/**",
  "**/vendor/**",
  "**/.git/**",
  "**/.venv/**",
  "**/submodules/**",
  "**/*.test.ts",
  "**/docs/_plans/**",
  "**/*.svg"
]
ignore-hidden = true
ignore-dot = true
ignore-vcs = true


[default]
binary = false
check-filename = true
check-file = true
unicode = true
locale = "en"
extend-ignore-re = [
  '''(?:\*{1,2}/)?\[.*\]\w''',
  '''`(als|hsi)`''' # Ignore these specific inline code patterns
]
extend-ignore-identifiers-re = []
extend-ignore-words-re = []

[default.extend-words]
# <typo> = "<correction>"

[default.extend-identifiers]
# <typo> = "<correction>"

[type.ts.extend-words]
  "leafs" = "leafs" # This is intentionally left as "leafs"
