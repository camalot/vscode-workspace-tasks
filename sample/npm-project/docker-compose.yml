services:
  webapp:
    # Use a pre-built image from Docker Hub
    image: wordpress:latest
    # Map port 80 of the container to port 80 on the host machine
    ports:
      - "80:80"
    # Mount a local volume for persistent data
    volumes:
      - wp_data:/var/www/html
    # Define environment variables for the application to connect to the database
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: somepassword
      WORDPRESS_DB_NAME: wordpress
    restart: always

  db:
    # Use the MariaDB image which is a popular choice for MySQL compatibility
    image: mariadb:10.6.4-focal
    # Mount a local volume for persistent database data
    volumes:
      - db_data:/var/lib/mysql
    # Set environment variables, including the root password
    environment:
      MYSQL_ROOT_PASSWORD: somepassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: somepassword
    # Expose the database port internally, but not necessarily to the host
    expose:
      - 3306
    restart: always

volumes:
  wp_data:
  db_data:
