plugins {
    // Apply the 'java' plugin to add support for Java compilation
    id 'java'
    // Apply the 'application' plugin to add support for building a CLI application
    id 'application'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    // Use Maven Central for dependencies
    mavenCentral()
}

dependencies {
    // Declare the dependency for the main application
    // For more complex projects, you might use 'implementation' instead of 'compile'
    // implementation 'com.google.guava:guava:33.2.1-jre'

    // Declare a dependency for testing purposes
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}

// Configure the test task to use JUnit Platform
test {
    useJUnitPlatform()
}

// Define the main class for the application plugin
application {
    mainClass = 'org.example.App'
}

// Define a simple custom task that prints a message
task hello {
    doLast {
        println 'Hello, Gradle!'
    }
}

// Define a task to copy specific files from one directory to another
task copyImages(type: Copy) {
    println 'Configuring copyImages task...'
    from 'data' // Source directory (relative path)
    include '*.jpg' // Include only jpg files
    into 'images' // Destination directory (relative path)
}

// Define a task that depends on the 'copyImages' task
task prepareData(dependsOn: copyImages) {
    doLast {
        println 'Data is prepared, including copied images.'
    }
}
