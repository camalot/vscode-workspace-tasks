---
name: "VSIX SBOM Generation"
description: "Generates an SPDX JSON SBOM from the packaged VSIX contents."
inputs:
  github-token:
    description: 'GitHub Token'
    required: true
    default: ${{ github.token }}
  target-asset:
    description: 'Target asset for SBOM generation'
    required: true
outputs:
  sbom-path:
    description: 'Path to the generated SPDX JSON SBOM'
    value: ${{ steps.extract_vsix.outputs.sbom_path }}

runs:
  using: "composite"
  steps:
    - name: Extract VSIX Package
      id: extract_vsix
      shell: bash
      env:
        TARGET_ASSET: ${{ inputs.target-asset }}
      run: |
        set -euo pipefail
        if [ ! -f "$TARGET_ASSET" ]; then
          echo "::error::VSIX not found: $TARGET_ASSET"
          exit 1
        fi

        EXTRACT_DIR=$(mktemp -d "${RUNNER_TEMP}/vsix-sbom.XXXXXX")
        echo "extract_dir=$EXTRACT_DIR" >> "$GITHUB_OUTPUT"
        echo "sbom_path=${TARGET_ASSET}.sbom.json" >> "$GITHUB_OUTPUT"
        echo "sbom_name=$(basename "$TARGET_ASSET").sbom.json" >> "$GITHUB_OUTPUT"
        unzip -q "$TARGET_ASSET" -d "$EXTRACT_DIR"

    - name: Generate SBOM
      uses: anchore/sbom-action@v0
      with:
        path: ${{ steps.extract_vsix.outputs.extract_dir }}
        format: spdx-json
        artifact-name: ${{ steps.extract_vsix.outputs.sbom_name }}
        output-file: ${{ steps.extract_vsix.outputs.sbom_path }}
        upload-release-assets: false
        github-token: ${{ inputs.github-token }}

    - name: Clean extracted VSIX
      if: ${{ always() && steps.extract_vsix.outputs.extract_dir != '' }}
      shell: bash
      env:
        EXTRACT_DIR: ${{ steps.extract_vsix.outputs.extract_dir }}
      run: rm -rf -- "$EXTRACT_DIR"
