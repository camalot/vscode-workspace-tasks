---
name: Run tests

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  # push:
  #   branches:
  #     - develop
  #     - pre-release
  #   paths-ignore:
  #     - 'syntaxes/**'
  #     - 'tests/**'
  #     - '**.md'
  # pull_request:
  #   branches:
  #     - develop
  #     - pre-release
  #   paths-ignore:
  #     - 'syntaxes/**'
  #     - 'tests/**'
  #     - '**.md'
permissions: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Types
        run: pnpm run check:types
      - name: Format
        run: pnpm run check:format
      - name: Lint
        run: pnpm run lint

  test:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        vscode:
          - '1.105.1'
          - 'insiders'
          - 'stable'
        os:
          # - windows-latest
          # - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Clean Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Allow unprivileged user namespace (ubuntu)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run Tests
        run: xvfb-run -a pnpm test
        if: runner.os == 'Linux'
      - name: Run Tests
        run: pnpm test
        if: runner.os != 'Linux'
      - name: Run UI Tests
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' pnpm run test:ui
        if: runner.os == 'Linux'
      - name: Run UI Tests
        run: pnpm run test:ui
        if: runner.os != 'Linux'
