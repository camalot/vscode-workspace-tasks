name: CI

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - develop
  # pull_request:
  #   branches:
  #     - develop

permissions:
  contents: read
  actions: read
  checks: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run compile

      - name: Test
        run: npm test

      - name: Package VSIX (dry run)
        run: npm run package:vsix
