---
name: CI

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
  pull_request:
    branches:
      - develop

permissions: {}
env:
  ACT: ""
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Prepare Super-Linter log directory
        run: mkdir -p reports/super-linter

      - name: Lint Codebase
        uses: camalot/actions/smells/lint@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          super_linter_env_file: .github/linters/super-linter.env
          validate_all_codebase: true
          default_branch: ${{ github.ref_name }}
        env:
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: true

      # - name: Super-Linter
      #   uses: super-linter/super-linter@v8
      #   env:
      #     GITHUB_TOKEN: "${{ github.token }}"
          # DEFAULT_BRANCH: "develop"
          # CREATE_LOG_FILE: true
          # LOG_FILE: reports/super-linter/super-linter-summary.ansi.log
          # FILTER_REGEX_EXCLUDE: '(test|node_modules|docs)/|(CHANGELOG|CONFIGURATION|SUPPORT|README|CONTRIBUTING|copilot-instructions)\.md$'
          # VALIDATE_ALL_CODEBASE: true
          # VALIDATE_BASH_EXEC: false
          # VALIDATE_BIOME_FORMAT: false
          # VALIDATE_BIOME_LINT: false
          # VALIDATE_CHECKOV: false
          # VALIDATE_CSS: false
          # VALIDATE_CSS_PRETTIER: false
          # VALIDATE_HTML_PRETTIER: false
          # VALIDATE_JAVASCRIPT_ES: false # DISABLED
          # VALIDATE_JSON: false
          # VALIDATE_JAVASCRIPT_PRETTIER: false
          # VALIDATE_JSON_PRETTIER: false
          # VALIDATE_JSCPD: false
          # VALIDATE_MARKDOWN_PRETTIER: false
          # VALIDATE_NATURAL_LANGUAGE: false
          # VALIDATE_PRETTIER: false
          # VALIDATE_SPELL_CODESPELL: false
          # VALIDATE_TRIVY: false
          # VALIDATE_TYPESCRIPT_ES: false # TEMPORARY DISABLE
          # VALIDATE_TYPESCRIPT_PRETTIER: false
          # VALIDATE_YAML_PRETTIER: false
          # FIX_BIOME_FORMAT: false
          # FIX_JSON_PRETTIER: false
          # FIX_MARKDOWN_PRETTIER: false
          # FIX_YAML_PRETTIER: false

      - name: Build
        run: pnpm run compile

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnspr4 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
          libcups2t64 libdrm2 libgtk-3-0t64 libgbm1 libasound2t64 libxss1 xvfb


      - name: Test
        run: xvfb-run -a pnpm run test:coverage

      - name: Upload coverage reports to Codecov
        if: ${{ !env.ACT }}
        uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: true # optional (default = false)
          files: coverage/lcov.info
          token: ${{ env.CODECOV_TOKEN }}
          verbose: true # optional (default = false)
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !env.ACT }}
        uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: true
          files: coverage/junit.xml
          report_type: test_results
          disable_search: true
          token: ${{ env.CODECOV_TOKEN }}
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Package VSIX (dry run)
        run: pnpm run package:vsix

      - name: VSIX Information
        run: pnpm exec vsce ls --tree
