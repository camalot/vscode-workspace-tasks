---
name: Release

on:  # yamllint disable-line rule:truthy
  # push:
  #   tags:
  #     - "v*"
  # release:
  #   types:
  #     - published
  workflow_dispatch:

permissions: {}
env:
  PACKAGE_OWNER: 'darthminos'
  PACKAGE_NAME: 'workspace-tasks'
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    outputs:
      ver_major_minor_patch: ${{ steps.get.outputs.major_minor_patch }}
      ver_major_minor: ${{ steps.get.outputs.major_minor }}
      ver_major: ${{ steps.get.outputs.major }}
      tag: ${{ steps.get.outputs.tag_major_minor_patch }}
      tag_major: ${{ steps.get.outputs.tag_major }}
      tag_major_minor: ${{ steps.get.outputs.tag_major_minor }}
      tag_major_minor_patch: ${{ steps.get.outputs.tag_major_minor_patch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine next version
        id: get
        uses: camalot/actions/version/get@v1
        with:
          default_version: v1.0.0
          fail_on_default: true
          enable_pr_comment: true
          token: ${{ github.token }}
      - run: |
          echo "next version: ${TAG}"
        env:
          TAG: ${{ steps.get.outputs.tag_major_minor_patch }}
          VERSION: ${{ steps.get.outputs.major_minor_patch }}
          TAG_MAJOR: ${{ steps.get.outputs.tag_major }}
          TAG_MAJOR_MINOR: ${{ steps.get.outputs.tag_major_minor }}
          TAG_MAJOR_MINOR_PATCH: ${{ steps.get.outputs.tag_major_minor_patch }}
          VER_MAJOR: ${{ steps.get.outputs.major }}
          VER_MAJOR_MINOR: ${{ steps.get.outputs.major_minor }}
          VER_MAJOR_MINOR_PATCH: ${{ steps.get.outputs.major_minor_patch }}

  publish-vscode-marketplace:
    runs-on: ubuntu-latest
    environment: production
    needs:
      - version
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm run test

      - name: Build
        run: pnpm run compile

      - name: Generate Changelog
        run: |
          pnpm version "${VERSION}" --no-git-tag-version
          pnpm exec git-cliff --tag "${TAG}" --output "CHANGELOG.md"
          cat "CHANGELOG.md" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ needs.version.outputs.ver_major_minor_patch }}
          TAG: ${{ needs.version.outputs.tag_major_minor_patch }}

      - name: Package VSIX
        run: |
          mkdir -p dist
          pnpm run package:vsix -- --out "dist/${PACKAGE_OWNER}-${PACKAGE_NAME}-${VERSION}.vsix"
        env:
          VERSION: ${{ needs.version.outputs.ver_major_minor_patch }}

      # COMMIT VERSION AND CHANGELOG
      - name: Commit Version and Changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "CHANGELOG.md" "package.json" "pnpm-lock.yaml"
          git commit -m "chore(release): ${VERSION} 🚀" || echo "No changes to commit"
          git tag "${TAG}" || echo "Tag already exists"
          git push origin HEAD --tags
        env:
          VERSION: ${{ needs.version.outputs.ver_major_minor_patch }}
          TAG: ${{ needs.version.outputs.tag_major_minor_patch }}

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if ! gh release view "$TAG" --repo "${{ github.repository }}" 2>/dev/null; then
            gh release create "$TAG" --title "$TAG" --generate-notes --repo "${{ github.repository }}"
            echo -e "\e[32mRelease $TAG created.\e[0m"
          else
            echo -e "\e[33mRelease $TAG already exists.\e[0m"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag_major_minor_patch }}

      - name: Verify VSIX file exists
        run: |
          VSIX="dist/${PACKAGE_OWNER}-${PACKAGE_NAME}-${VERSION}.vsix"
          if [ ! -f "$VSIX" ]; then
            echo -e "\e[31mVSIX not found: $VSIX\e[0m" >&2
            echo "Contents of dist/:"
            ls -la dist/
            exit 1
          fi
          echo -e "\e[32mVSIX generated: $VSIX ($(du -h "$VSIX" | cut -f1))\e[0m"
          pnpm exec vsce ls --tree
        env:
          VERSION: ${{ needs.version.outputs.ver_major_minor_patch }}

      - name: Publish to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ env.OPEN_VSX_TOKEN }}
          registryUrl: https://open-vsx.org
          skipDuplicate: true
          extensionFile: dist/${{ env.PACKAGE_OWNER }}-${{ env.PACKAGE_NAME }}-${{ env.VERSION }}.vsix
        env:
          VERSION: ${{ needs.version.outputs.ver_major_minor_patch }}
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}

      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ env.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          skipDuplicate: true
          extensionFile: dist/${{ env.PACKAGE_OWNER }}-${{ env.PACKAGE_NAME }}-${{ env.VERSION }}.vsix
        env:
          VERSION: ${{ needs.version.outputs.ver_major_minor_patch }}
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}

      - name: Upload VSIX to release
        run: |
          VSIX="dist/${PACKAGE_OWNER}-${PACKAGE_NAME}-${VERSION}.vsix"
          if [ ! -f "$VSIX" ]; then
            echo -e "\e[31mVSIX not found before upload: $VSIX\e[0m" >&2
            exit 1
          fi
          gh release upload "${TAG}" "$VSIX" --repo "${{ github.repository }}" --clobber
          echo -e "\e[32mVSIX uploaded to release $TAG\e[0m"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.ver_major_minor_patch }}
          TAG: ${{ needs.version.outputs.tag_major_minor_patch }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: dist/*.vsix
