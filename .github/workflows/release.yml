---
name: Release

on:  # yamllint disable-line rule:truthy
  # push:
  #   tags:
  #     - "v*"
  # release:
  #   types:
  #     - published
  workflow_dispatch:

permissions: {}
env:
  PACKAGE_OWNER: 'darthminos'
  PACKAGE_NAME: 'workspace-tasks'
jobs:
  publish-vscode-marketplace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Current Version
        id: current_version
        run: |
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          # if $CURRENT_VERSION starts with v do not add
          if [[ "$CURRENT_VERSION" == v* ]]; then
            CURRENT_VERSION="${CURRENT_VERSION:1}"
          fi

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Get Next Version
        id: next_version
        run: |
          NEXT_VERSION="$(npx git-cliff --bumped-version)"
          # if $NEXT_VERSION starts with v do not add
          if [[ "$NEXT_VERSION" == v* ]]; then
            NEXT_VERSION="${NEXT_VERSION:1}"
          fi

          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Clean Version and Tag
        id: tag
        run: |
          if [[ -z "$VERSION" ]]; then
            echo "VERSION is empty, using current version"
            VERSION="${CURRENT_VERSION}"
          fi
          if [[ "$VERSION" == v* ]]; then
            VERSION="${VERSION:1}"
          fi

          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.next_version.outputs.next_version }}
          CURRENT_VERSION: ${{ steps.current_version.outputs.current_version }}

      - name: Run Tests
        run: npm run test

      - name: Build
        run: npm run compile

      - name: Package VSIX
        run: |
          mkdir -p dist
          npm run package:vsix -- --out "dist/${PACKAGE_OWNER}-${PACKAGE_NAME}-${VERSION}.vsix"
        env:
          VERSION: ${{ steps.tag.outputs.version }}

      - name: Generate Changelog
        run: |
          npm version "${VERSION}" --no-git-tag-version
          npx git-cliff --tag "${TAG}" --output "CHANGELOG.md"
          cat "CHANGELOG.md" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}

      # COMMIT VERSION AND CHANGELOG
      - name: Commit Version and Changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "CHANGELOG.md" "package.json" "package-lock.json"
          git commit -m "chore(release): ${VERSION} 🚀" || echo "No changes to commit"
          git tag "${TAG}" || echo "Tag already exists"
          git push origin HEAD --tags
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if ! gh release view "$TAG" --repo "${{ github.repository }}" 2>/dev/null; then
            gh release create "$TAG" --title "$TAG" --generate-notes --repo "${{ github.repository }}"
            echo -e "\e[32mRelease $TAG created.\e[0m"
          else
            echo -e "\e[33mRelease $TAG already exists.\e[0m"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Verify VSIX file exists
        run: |
          VSIX="dist/${PACKAGE_OWNER}-${PACKAGE_NAME}-${VERSION}.vsix"
          if [ ! -f "$VSIX" ]; then
            echo -e "\e[31mVSIX not found: $VSIX\e[0m" >&2
            echo "Contents of dist/:"
            ls -la dist/
            exit 1
          fi
          echo -e "\e[32mVSIX generated: $VSIX ($(du -h "$VSIX" | cut -f1))\e[0m"
          npx vsce ls --tree
        env:
          VERSION: ${{ steps.tag.outputs.version }}

      - name: Publish to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          registryUrl: https://open-vsx.org
          skipDuplicate: true
          extensionFile: dist/${{ env.PACKAGE_OWNER }}-${{ env.PACKAGE_NAME }}-${{ env.VERSION }}.vsix
        env:
          VERSION: ${{ steps.tag.outputs.version }}

      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          skipDuplicate: true
          extensionFile: dist/${{ env.PACKAGE_OWNER }}-${{ env.PACKAGE_NAME }}-${{ env.VERSION }}.vsix
        env:
          VERSION: ${{ steps.tag.outputs.version }}

      - name: Upload VSIX to release
        run: |
          VSIX="dist/${PACKAGE_OWNER}-${PACKAGE_NAME}-${VERSION}.vsix"
          if [ ! -f "$VSIX" ]; then
            echo -e "\e[31mVSIX not found before upload: $VSIX\e[0m" >&2
            exit 1
          fi
          gh release upload "${TAG}" "$VSIX" --repo "${{ github.repository }}" --clobber
          echo -e "\e[32mVSIX uploaded to release $TAG\e[0m"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: dist/*.vsix
