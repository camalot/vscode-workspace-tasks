---
name: Release

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      force_next_version:
        description: 'Force the next version. Must be in the format vX.Y.Z. Tag must not exist.'
        required: false
        default: ''
      vsix_publish:
        description: 'Whether to publish the VSIX to the marketplaces.'
        required: false
        default: 'true'
concurrency:
  # Release runs mutate shared tags and release state, so queue them instead of allowing overlap.
  group: ${{ github.workflow }}-${{ github.repository }}
permissions: {}
env:
  PACKAGE_OWNER: 'darthminos'
  PACKAGE_NAME: 'workspace-tasks'
  ACT: ""
  VS_MARKETPLACE_TOKEN: ""
  OPEN_VSX_TOKEN: ""
  GIT_USER_NAME: 'github-actions[bot]'
  GIT_USER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
jobs:
  version:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      statuses: write
      issues: write
      pull-requests: write
    outputs:
      current_version: ${{ steps.get.outputs.current_version }}
      ver_major_minor_patch: ${{ steps.get.outputs.major_minor_patch }}
      ver_major_minor: ${{ steps.get.outputs.major_minor }}
      ver_major: ${{ steps.get.outputs.major }}
      tag: ${{ steps.get.outputs.tag_major_minor_patch }}
      tag_major: ${{ steps.get.outputs.tag_major }}
      tag_major_minor: ${{ steps.get.outputs.tag_major_minor }}
      tag_major_minor_patch: ${{ steps.get.outputs.tag_major_minor_patch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine next version
        id: get
        uses: camalot/actions/version/get@v1
        with:
          default_version: v1.0.0
          fail_on_default: true
          enable_pr_comment: true
          token: ${{ github.token }}
        env:
          FORCE_NEXT_VERSION: ${{ github.event.inputs.force_next_version || '' }}
      - run: |
          echo "next version: ${TAG}"
        env:
          CURRENT_VERSION: ${{ steps.get.outputs.current_version }}
          TAG: ${{ steps.get.outputs.tag_major_minor_patch }}
          VERSION: ${{ steps.get.outputs.major_minor_patch }}
          TAG_MAJOR: ${{ steps.get.outputs.tag_major }}
          TAG_MAJOR_MINOR: ${{ steps.get.outputs.tag_major_minor }}
          TAG_MAJOR_MINOR_PATCH: ${{ steps.get.outputs.tag_major_minor_patch }}
          VER_MAJOR: ${{ steps.get.outputs.major }}
          VER_MAJOR_MINOR: ${{ steps.get.outputs.major_minor }}
          VER_MAJOR_MINOR_PATCH: ${{ steps.get.outputs.major_minor_patch }}

  verify:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      statuses: write
      issues: write
      pull-requests: write
    needs:
      - version
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          {
            echo "## Verify Release Initialization"
            echo ""
            echo "**ACTOR**: \`$ACTOR\`"
            echo "**BRANCH**: \`$BRANCH\`"
            echo "**OWNER**: \`$REPO_OWNER\`"
            echo "**REPO_NAME**: \`$REPO_NAME\`"
            echo "**PACKAGE_OWNER**: \`$PACKAGE_OWNER\`"
            echo "**PACKAGE_NAME**: \`$PACKAGE_NAME\`"
            echo "**ACT**: \`$ACT\`"
            echo ""
            echo "---"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -z "$ACT" ]; then
            {
              echo "❌ **ACT** is set to $ACT"
              echo "❌ Release Will **NOT** Proceed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ **ACT** Passes Check" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$REPO_NAME" != "vscode-workspace-tasks" ]; then
            {
              echo "❌ **REPO_NAME** is not vscode-workspace-tasks"
              echo "❌ Release Will **NOT** Proceed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ **REPO_NAME** Passes Check" >> "$GITHUB_STEP_SUMMARY"
          fi

          # release should only proceed if ACTOR is REPOSITORY Owner
          if [ "$ACTOR" != "$REPO_OWNER" ]; then
            {
              echo "❌ **ACTOR** is not the repository owner"
              echo "❌ Release Will **NOT** Proceed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ **ACTOR** Passes Check" >> "$GITHUB_STEP_SUMMARY"
          fi

          # release should only proceed if BRANCH is develop
          if [ "$BRANCH" != "refs/heads/develop" ]; then
              {
                echo "❌ **BRANCH** is not develop"
                echo "❌ Release Will **NOT** Proceed"
              } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ **BRANCH** Passes Check" >> "$GITHUB_STEP_SUMMARY"
          fi

          # release should only proceed if PACKAGE_OWNER is darthminos
          if [ "$PACKAGE_OWNER" != "darthminos" ]; then
            {
              echo "❌ **PACKAGE_OWNER** is not darthminos"
              echo "❌ Release Will **NOT** Proceed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ **PACKAGE_OWNER** Passes Check" >> "$GITHUB_STEP_SUMMARY"
          fi

          # release should only proceed if PACKAGE_NAME is workspace-tasks
          if [ "$PACKAGE_NAME" != "workspace-tasks" ]; then
            {
              echo "❌ **PACKAGE_NAME** is not workspace-tasks"
              echo "❌ Release Will **NOT** Proceed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ **PACKAGE_NAME** Passes Check" >> "$GITHUB_STEP_SUMMARY"
          fi

          # verify against package.json
          PACKAGE_NAME_JSON=$(jq -r '.name' package.json)
          PACKAGE_PUBLISHER_JSON=$(jq -r '.publisher' package.json)
          PACKAGE_VERSION_JSON=$(jq -r '.version' package.json)
          if [ "$PACKAGE_NAME_JSON" != "$PACKAGE_NAME" ]; then
            {
              echo "❌ **PACKAGE_NAME** in package.json is not $PACKAGE_NAME"
              echo "❌ Release Will **NOT** Proceed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ **PACKAGE_NAME** in package.json Passes Check" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$PACKAGE_PUBLISHER_JSON" != "$PACKAGE_OWNER" ]; then
            {
              echo "❌ **PACKAGE_PUBLISHER** in package.json is not $PACKAGE_OWNER"
              echo "❌ Release Will **NOT** Proceed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ **PACKAGE_PUBLISHER** in package.json Passes Check" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$PACKAGE_VERSION_JSON" != "$EXPECTED_VERSION" ]; then
            {
              echo "❌ **PACKAGE_VERSION** in package.json is not \`$EXPECTED_VERSION\`"
              echo "❌ Release Will **NOT** Proceed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ **PACKAGE_VERSION** in package.json Passes Check" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$FORCE_NEXT_VERSION" ]; then
            {
              echo "ℹ️ **FORCE_NEXT_VERSION** is set to $FORCE_NEXT_VERSION"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "✅ All Initial Checks Passed" >> "$GITHUB_STEP_SUMMARY"
          exit 0

    env:
      ACTOR: ${{ github.actor }}
      BRANCH: ${{ github.ref }}
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      EXPECTED_VERSION: ${{ needs.version.outputs.current_version }}
      FORCE_NEXT_VERSION: ${{ github.event.inputs.force_next_version || '' }}

  lint:
    runs-on: ubuntu-latest
    environment: production
    needs:
      - verify
    permissions:
      contents: read
      statuses: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: ./.github/actions/lint
        with:
          github-token: ${{ github.token }}

  test:
    runs-on: ubuntu-latest
    environment: production
    needs:
      - verify
    permissions:
      contents: read
      statuses: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: ./.github/actions/test
        with:
          github-token: ${{ github.token }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  publish-vscode-marketplace:
    runs-on: ubuntu-latest
    environment: production
    needs:
      - version
      - verify
      - lint
      - test
    env:
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
      VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
    permissions:
      contents: write
      statuses: write
      issues: write
      pull-requests: write
      deployments: write
      artifact-metadata: write
      checks: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
          token: "${{ github.token }}"

      - name: Configure git
        shell: bash
        run: |
          echo "::group::Configure git user"
          git config user.name  "${GIT_USER_NAME}"
          git config user.email "${GIT_USER_EMAIL}"
          gh auth setup-git
          echo "::endgroup::"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          echo "::group::Build"
          pnpm run compile
          echo "::endgroup::"

      - name: Prepare package.json file
        # we do not commit here. The release call does a commit.
        # if it fails, then we don't commit this change
        run: |
          echo "::group::Prepare package.json"
          yq eval --inplace ".version = \"${VERSION}\"" package.json
          git add package.json
          echo "::endgroup::"
        env:
          VERSION: ${{ needs.version.outputs.ver_major_minor_patch }}

      - name: Package VSIX
        run: |
          echo "::group::Packaging VSIX"
          mkdir -p dist
          pnpm exec vsce package --no-dependencies --out "dist/${PACKAGE_OWNER}-${PACKAGE_NAME}-${VERSION}.vsix"
          echo "::endgroup::"
        env:
          VERSION: ${{ needs.version.outputs.ver_major_minor_patch }}

      - name: Capture pre-release state
        id: rollback_state
        # Record HEAD and the floating tags' prior targets BEFORE the release
        # moves them, so the rollback step can restore them if a later step
        # (publish/upload) fails after a successful release.
        run: |
          set -euo pipefail
          echo "::group::Capture pre-release state (for rollback)"
          {
            echo "head_sha=$(git rev-parse HEAD)"
            echo "tag_major_sha=$(git ls-remote origin "refs/tags/${TAG_MAJOR}" | awk 'NR==1{print $1}')"
            echo "tag_major_minor_sha=$(git ls-remote origin "refs/tags/${TAG_MAJOR_MINOR}" | awk 'NR==1{print $1}')"
          } >> "${GITHUB_OUTPUT}"
          echo "::endgroup::"
        env:
          TAG_MAJOR: ${{ needs.version.outputs.tag_major }}
          TAG_MAJOR_MINOR: ${{ needs.version.outputs.tag_major_minor }}

      - name: Verify VSIX file exists
        run: |
          VSIX="dist/${PACKAGE_OWNER}-${PACKAGE_NAME}-${VERSION}.vsix"
          echo "::group::VSIX: $VSIX"
          if [ ! -f "$VSIX" ]; then
            echo -e "\e[31mVSIX not found: $VSIX\e[0m" >&2
            echo "Contents of dist/:"
            ls -la dist/
            exit 1
          fi
          echo -e "\e[32mVSIX generated: $VSIX ($(du -h "$VSIX" | cut -f1))\e[0m"
          pnpm exec vsce ls --tree --no-dependencies
          echo "::endgroup::"
        env:
          VERSION: ${{ needs.version.outputs.ver_major_minor_patch }}

      # - name: SBOM Generation
      #   uses: ./.github/actions/sbom
      #   with:
      #     github-token: ${{ github.token }}
      #     target-asset: "dist/${PACKAGE_OWNER}-${PACKAGE_NAME}-${VERSION}.vsix"
      #   env:
      #     VERSION: ${{ needs.version.outputs.ver_major_minor_patch }}

      - name: Create Release
        id: create_release
        uses: camalot/actions/version/release@v1
        with:
          tag_major: ${{ needs.version.outputs.tag_major }}
          tag_major_minor: ${{ needs.version.outputs.tag_major_minor }}
          tag_major_minor_patch: ${{ needs.version.outputs.tag_major_minor_patch }}
          token: ${{ github.token }}
        env:
          UPDATE_FILE_CHANGELOG: "CHANGELOG.md"
          # we update in this so fake file name here
          UPDATE_FILE_PACKAGE_JSON: "fake-ignore-package.json"
          UPDATE_FILE_JEKYLL_CONFIG: "docs/_config.yml"
          RELEASE_FILES_GLOB: "dist/*.vsix"

      - name: Setup to Publish
        shell: bash
        run: |
          echo "::group::Setup to Publish"
          if [[ "${VSIX_PUBLISHZ,,}" != "true" ]]; then
            echo "VSIX_PUBLISH=false" >> "$GITHUB_ENV"
          else
            echo "VSIX_PUBLISH=true" >> "$GITHUB_ENV"
          fi
          echo "::endgroup::"
        env:
          VSIX_PUBLISHZ: ${{ inputs.vsix_publish }}

      - name: Publish to Open VSX Registry
        # only publish if everything before (incl. Create Release) succeeded
        if: ${{ success() && env.OPEN_VSX_TOKEN != '' && env.VSIX_PUBLISH == 'true' }}
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ env.OPEN_VSX_TOKEN }}
          registryUrl: https://open-vsx.org
          skipDuplicate: true
          extensionFile: dist/${{ env.PACKAGE_OWNER }}-${{ env.PACKAGE_NAME }}-${{ env.VERSION }}.vsix
        env:
          VERSION: ${{ needs.version.outputs.ver_major_minor_patch }}

      - name: Publish to Visual Studio Marketplace
        # only publish if everything before (incl. Create Release) succeeded
        if: ${{ success() && env.VS_MARKETPLACE_TOKEN != '' && env.VSIX_PUBLISH == 'true' }}
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ env.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          skipDuplicate: true
          extensionFile: dist/${{ env.PACKAGE_OWNER }}-${{ env.PACKAGE_NAME }}-${{ env.VERSION }}.vsix
        env:
          VERSION: ${{ needs.version.outputs.ver_major_minor_patch }}

      - name: Rollback release on later failure
        # Fires only when the release itself SUCCEEDED but a later step
        # (publish/upload) failed. If Create Release failed, the action has
        # already rolled itself back, so this is gated to avoid double-undo.
        if: ${{ failure() && steps.create_release.outcome == 'success' }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Rollback failed while executing: ${BASH_COMMAND}"' ERR
          echo "::warning::A step after the release failed — rolling back the release"
          echo "::group::Rollback"

          # 1) Delete the GitHub Release.
          if gh release view "${NEXT_TAG}" >/dev/null 2>&1; then
            gh release delete "${NEXT_TAG}" --yes
          else
            echo "GitHub Release ${NEXT_TAG} already absent"
          fi

          # 2) Delete the new patch tag; restore the floating tags to their
          #    prior targets (or delete them if they did not exist before).
          if git ls-remote --exit-code origin "refs/tags/${NEXT_TAG}" >/dev/null 2>&1; then
            git push origin ":refs/tags/${NEXT_TAG}"
          else
            echo "Patch tag ${NEXT_TAG} already absent"
          fi

          for pair in "${TAG_MAJOR}=${ORIG_TAG_MAJOR_SHA}" "${TAG_MAJOR_MINOR}=${ORIG_TAG_MAJOR_MINOR_SHA}"; do
            tag="${pair%%=*}"
            sha="${pair#*=}"
            if [[ -n "${sha}" ]]; then
              echo "Restoring ${tag} -> ${sha}"
              git push origin --force "${sha}:refs/tags/${tag}"
            else
              echo "Deleting ${tag} (did not exist before release)"
              if git ls-remote --exit-code origin "refs/tags/${tag}" >/dev/null 2>&1; then
                git push origin ":refs/tags/${tag}"
              else
                echo "Tag ${tag} already absent"
              fi
            fi
          done

          # 3) Revert the release commit via a new commit (no force-push), but
          #    only if a commit was actually made (HEAD moved since capture).
          if [[ "$(git rev-parse HEAD)" != "${ORIG_HEAD_SHA}" ]]; then
            echo "Reverting release commit on ${GITHUB_REF_NAME}"
            git revert --no-edit HEAD
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "::endgroup::"
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ needs.version.outputs.tag_major_minor_patch }}
          TAG_MAJOR: ${{ needs.version.outputs.tag_major }}
          TAG_MAJOR_MINOR: ${{ needs.version.outputs.tag_major_minor }}
          ORIG_HEAD_SHA: ${{ steps.rollback_state.outputs.head_sha }}
          ORIG_TAG_MAJOR_SHA: ${{ steps.rollback_state.outputs.tag_major_sha }}
          ORIG_TAG_MAJOR_MINOR_SHA: ${{ steps.rollback_state.outputs.tag_major_minor_sha }}

  publish-docs:
    runs-on: ubuntu-latest
    environment: production
    continue-on-error: true
    needs:
      - publish-vscode-marketplace

    permissions:
      contents: read # for actions/checkout
      pages: write # to deploy to GitHub Pages
      id-token: write # to authenticate with GitHub Actions OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Publish Docs to GitHub Pages
        uses: camalot/actions/docs/drjekyll@v1
        env:
          JEKYLL_ENV: production
        with:
          input_dir: ./docs
          output_dir: ./_site
