---
name: Release

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:

permissions: {}
env:
  PACKAGE_OWNER: 'darthminos'
  PACKAGE_NAME: 'workspace-tasks'
  ACT: ""
  VS_MARKETPLACE_TOKEN: ""
  OPEN_VSX_TOKEN: ""
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    needs:
      - version
    permissions:
      contents: read
      statuses: write
      issues: write
      pull-requests: write
    steps:
      - run: |
          echo "## Verify Release Initialization" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**ACTOR**: $ACTOR" >> "$GITHUB_STEP_SUMMARY"
          echo "**BRANCH**: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "**OWNER**: $OWNER" >> "$GITHUB_STEP_SUMMARY"
          echo "**REPO_NAME**: $REPO_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**PACKAGE_OWNER**: $PACKAGE_OWNER" >> "$GITHUB_STEP_SUMMARY"
          echo "**PACKAGE_NAME**: $PACKAGE_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**ACT**: $ACT" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -z "$ACT" ]; then
            echo "❌ **ACT** is set to $ACT" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ Release Will **NOT** Proceed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ **ACT** Passes Check" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$REPO_NAME" != "vscode-workspace-tasks" ]; then
            echo "❌ **REPO_NAME** is not vscode-workspace-tasks" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ Release Will **NOT** Proceed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ **REPO_NAME** Passes Check" >> "$GITHUB_STEP_SUMMARY"
          fi

          # release should only proceed if ACTOR is REPOSITORY Owner
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "❌ **ACTOR** is not the repository owner" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ Release Will **NOT** Proceed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ **ACTOR** Passes Check" >> "$GITHUB_STEP_SUMMARY"
          fi

          # release should only proceed if BRANCH is main
          if [ "$BRANCH" != "refs/heads/main" ]; then
            echo "❌ **BRANCH** is not main" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ Release Will **NOT** Proceed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ **BRANCH** Passes Check" >> "$GITHUB_STEP_SUMMARY"
          fi

          # release should only proceed if PACKAGE_OWNER is darthminos
          if [ "$PACKAGE_OWNER" != "darthminos" ]; then
            echo "❌ **PACKAGE_OWNER** is not darthminos" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ Release Will **NOT** Proceed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ **PACKAGE_OWNER** Passes Check" >> "$GITHUB_STEP_SUMMARY"
          fi

          # release should only proceed if PACKAGE_NAME is workspace-tasks
          if [ "$PACKAGE_NAME" != "workspace-tasks" ]; then
            echo "❌ **PACKAGE_NAME** is not workspace-tasks" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ Release Will **NOT** Proceed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ **PACKAGE_NAME** Passes Check" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "✅ All Initial Checks Passed" >> "$GITHUB_STEP_SUMMARY"
          exit 0

    env:
      ACTOR: ${{ github.actor }}
      BRANCH: ${{ github.ref }}
      OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}

  version:
    runs-on: ubuntu-latest
    environment: production
    needs:
      - verify
    permissions:
      contents: read
      statuses: write
      issues: write
      pull-requests: write
    outputs:
      ver_major_minor_patch: ${{ steps.get.outputs.major_minor_patch }}
      ver_major_minor: ${{ steps.get.outputs.major_minor }}
      ver_major: ${{ steps.get.outputs.major }}
      tag: ${{ steps.get.outputs.tag_major_minor_patch }}
      tag_major: ${{ steps.get.outputs.tag_major }}
      tag_major_minor: ${{ steps.get.outputs.tag_major_minor }}
      tag_major_minor_patch: ${{ steps.get.outputs.tag_major_minor_patch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine next version
        id: get
        uses: camalot/actions/version/get@v1
        with:
          default_version: v1.0.0
          fail_on_default: true
          enable_pr_comment: true
          token: ${{ github.token }}
      - run: |
          echo "next version: ${TAG}"
        env:
          TAG: ${{ steps.get.outputs.tag_major_minor_patch }}
          VERSION: ${{ steps.get.outputs.major_minor_patch }}
          TAG_MAJOR: ${{ steps.get.outputs.tag_major }}
          TAG_MAJOR_MINOR: ${{ steps.get.outputs.tag_major_minor }}
          TAG_MAJOR_MINOR_PATCH: ${{ steps.get.outputs.tag_major_minor_patch }}
          VER_MAJOR: ${{ steps.get.outputs.major }}
          VER_MAJOR_MINOR: ${{ steps.get.outputs.major_minor }}
          VER_MAJOR_MINOR_PATCH: ${{ steps.get.outputs.major_minor_patch }}

  lint:
    runs-on: ubuntu-latest
    environment: production
    needs:
      - verify
    permissions:
      contents: read
      statuses: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: ./.github/workflows/lint

  test:
    runs-on: ubuntu-latest
    environment: production
    needs:
      - verify
    permissions:
      contents: read
      statuses: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: ./.github/workflows/test

  publish-vscode-marketplace:
    runs-on: ubuntu-latest
    environment: production
    needs:
      - version
      - verify
      - lint
      - test
    permissions:
      contents: write
      statuses: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm run test

      - name: Build
        run: pnpm run compile

      - name: Package VSIX
        run: |
          mkdir -p dist
          pnpm run package:vsix -- --out "dist/${PACKAGE_OWNER}-${PACKAGE_NAME}-${VERSION}.vsix"
        env:
          VERSION: ${{ needs.version.outputs.ver_major_minor_patch }}

      - name: Create Release
        uses: camalot/actions/release@v1
        with:
          tag_major: ${{ needs.version.outputs.tag_major }}
          tag_major_minor: ${{ needs.version.outputs.tag_major_minor }}
          tag_major_minor_patch: ${{ needs.version.outputs.tag_major_minor_patch }}
          token: ${{ github.token }}
        env:
          UPDATE_FILE_CHANGELOG: "CHANGELOG.md"
          PACKAGE_JSON_FILE: "package.json"
          UPDATE_FILE_JEKYLL_CONFIG : "docs/_config.yml"

      - name: Verify VSIX file exists
        run: |
          VSIX="dist/${PACKAGE_OWNER}-${PACKAGE_NAME}-${VERSION}.vsix"
          if [ ! -f "$VSIX" ]; then
            echo -e "\e[31mVSIX not found: $VSIX\e[0m" >&2
            echo "Contents of dist/:"
            ls -la dist/
            exit 1
          fi
          echo -e "\e[32mVSIX generated: $VSIX ($(du -h "$VSIX" | cut -f1))\e[0m"
          pnpm exec vsce ls --tree --no-dependencies
        env:
          VERSION: ${{ needs.version.outputs.ver_major_minor_patch }}

      - name: Publish to Open VSX Registry
        if: ${{ env.OPEN_VSX_TOKEN != '' }}
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ env.OPEN_VSX_TOKEN }}
          registryUrl: https://open-vsx.org
          skipDuplicate: true
          extensionFile: dist/${{ env.PACKAGE_OWNER }}-${{ env.PACKAGE_NAME }}-${{ env.VERSION }}.vsix
        env:
          VERSION: ${{ needs.version.outputs.ver_major_minor_patch }}
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}

      - name: Publish to Visual Studio Marketplace
        if: ${{ env.VS_MARKETPLACE_TOKEN != '' }}
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ env.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          skipDuplicate: true
          extensionFile: dist/${{ env.PACKAGE_OWNER }}-${{ env.PACKAGE_NAME }}-${{ env.VERSION }}.vsix
        env:
          VERSION: ${{ needs.version.outputs.ver_major_minor_patch }}
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}

      - name: Upload VSIX to release
        run: |
          VSIX="dist/${PACKAGE_OWNER}-${PACKAGE_NAME}-${VERSION}.vsix"
          if [ ! -f "$VSIX" ]; then
            echo -e "\e[31mVSIX not found before upload: $VSIX\e[0m" >&2
            exit 1
          fi
          gh release upload "${TAG}" "$VSIX" --repo "${{ github.repository }}" --clobber
          echo -e "\e[32mVSIX uploaded to release $TAG\e[0m"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.ver_major_minor_patch }}
          TAG: ${{ needs.version.outputs.tag_major_minor_patch }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: dist/*.vsix

  publish-docs:
    runs-on: ubuntu-latest
    environment: production
    needs:
      - publish-vscode-marketplace

    permissions:
      contents: read # for actions/checkout
      pages: write # to deploy to GitHub Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Publish Docs to GitHub Pages
        uses: camalot/actions/docs/drjekyll@v1
        env:
          JEKYLL_ENV: production
        with:
          input_dir: ./docs
          output_dir: ./_site
          url: ${{ steps.pages.outputs.origin }}
          baseurl: "${{ steps.pages.outputs.base_path }}"
