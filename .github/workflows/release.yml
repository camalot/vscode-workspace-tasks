name: Release

on:
  # push:
  #   tags:
  #     - "v*"
  # release:
  #   types:
  #     - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (ex: v1.1.1)"
        required: true
        default: "v1.1.1"

permissions: {}
env:
  PACKAGE_OWNER: "darthminos"
  PACKAGE_NAME: "workspace-tasks"
jobs:
  publish-vscode-marketplace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || (github.event_name == 'push' && github.ref) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "25.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Get Next Version
        id: next_version
        run: |
          NEXT_VERSION=$(npx git-cliff --bumped-version)
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Clean Version and Tag
        id: tag
        run: |
          VERSION="${{ steps.next_version.outputs.next_version }}"
          TAG="v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT


      - name: Run Tests
        run: npm run test

      - name: Build
        run: npm run compile

      - name: Package VSIX
        run: |
          mkdir -p dist
          npm run package:vsix --out dist/${{ env.PACKAGE_OWNER }}-${{ env.PACKAGE_NAME }}-${{ steps.tag.outputs.version }}.vsix

      - name: Generate Changelog
        run: |
          npm version ${{ env.VERSION }} --no-git-tag-version
          npx git-cliff --tag ${{ env.TAG }} --output CHANGELOG.md
          cat CHANGELOG.md >> $GITHUB_STEP_SUMMARY
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}

      # COMMIT VERSION AND CHANGELOG
      - name: Commit Version and Changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json package-lock.json
          git commit -m "chore(release): ${VERSION} 🚀" || echo "No changes to commit"
          git tag ${{ steps.tag.outputs.tag }} || echo "Tag already exists"
          git push origin HEAD --tags
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" 2>/dev/null; then
            gh release create "$TAG" --title "$TAG" --generate-notes --repo "${{ github.repository }}"
            echo "Release $TAG created."
          else
            echo "Release $TAG already exists."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify VSIX file exists
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          VSIX="dist/${{ env.PACKAGE_OWNER }}-${{ env.PACKAGE_NAME }}-${VERSION}.vsix"
          if [ ! -f "$VSIX" ]; then
            echo "VSIX not found: $VSIX" >&2
            echo "Contents of dist/:"
            ls -la dist/
            exit 1
          fi
          echo "VSIX generated: $VSIX ($(du -h "$VSIX" | cut -f1))"
          npx vsce ls --tree

      - name: Publish to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          registryUrl: https://open-vsx.org
          skipDuplicate: true
          extensionFile: dist/${{ env.PACKAGE_OWNER }}-${{ env.PACKAGE_NAME }}-${{ steps.tag.outputs.version }}.vsix
      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          skipDuplicate: true
          extensionFile: dist/${{ env.PACKAGE_OWNER }}-${{ env.PACKAGE_NAME }}-${{ steps.tag.outputs.version }}.vsix

      - name: Upload VSIX to release
        run: |
          VSIX="dist/${{ env.PACKAGE_OWNER }}-${{ env.PACKAGE_NAME }}-${{ env.VERSION }}.vsix"
          if [ ! -f "$VSIX" ]; then
            echo "::error::VSIX not found before upload: $VSIX" >&2
            exit 1
          fi
          gh release upload "$TAG" "$VSIX" --repo "${{ github.repository }}" --clobber
          echo "VSIX uploaded to release $TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: vsix
          path: dist/*.vsix
