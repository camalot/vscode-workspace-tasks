<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}' {{cspSource}}">
  <title>Task History</title>
  <!-- Chart.js UMD bundle (vendored local resource) -->
  <script nonce="{{nonce}}" src="{{chartJsUri}}"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family: var(--vscode-font-family);
      color: var(--vscode-foreground);
      background-color: var(--vscode-editor-background);
      cursor: default;
      display: flex;
      flex-direction: column;
    }

    /* ── Tab strip ─────────────────────────────────────────── */
    .tab-strip {
      display: flex;
      flex-shrink: 0;
      border-bottom: 1px solid var(--vscode-panel-border);
      background-color: var(--vscode-editorGroupHeader-tabsBackground);
    }

    .tab-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--vscode-foreground);
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .tab-btn:hover {
      background-color: var(--vscode-list-hoverBackground);
    }

    .tab-btn.active {
      border-bottom-color: var(--vscode-focusBorder);
      color: var(--vscode-editor-foreground);
      font-weight: 600;
    }

    /* ── Summary bar ────────────────────────────────────────── */
    .summary-bar {
      display: flex;
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 4px 12px;
      padding: 5px 10px;
      background-color: var(--vscode-sideBarSectionHeader-background);
      border-bottom: 1px solid var(--vscode-panel-border);
      font-size: 0.85em;
    }

    .summary-item {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .summary-label {
      color: var(--vscode-descriptionForeground);
    }

    .summary-value {
      font-weight: 600;
    }

    .summary-divider {
      color: var(--vscode-panel-border);
    }

    /* ── Scrollable panel area ──────────────────────────────── */
    #history-panel,
    #stats-panel,
    #dashboard-panel {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
    }

    /* ── History table ──────────────────────────────────────── */
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: var(--vscode-font-size);
    }

    th,
    td {
      text-align: left;
      padding: 6px 10px;
      border-bottom: 1px solid var(--vscode-panel-border);
    }

    th {
      background-color: var(--vscode-editorGroupHeader-tabsBackground);
      color: var(--vscode-editor-foreground);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 2;
      cursor: pointer;
      user-select: none;
    }

    th:hover {
      background-color: var(--vscode-list-hoverBackground);
    }

    th.sort-asc::after {
      content: " ▲";
      font-size: 0.8em;
    }

    th.sort-desc::after {
      content: " ▼";
      font-size: 0.8em;
    }

    tr:hover {
      background-color: var(--vscode-list-hoverBackground);
    }

    .status-running {
      color: var(--vscode-debugIcon-startForeground);
    }

    .status-running::before {
      content: "🔵 ";
    }

    .status-success {
      color: var(--vscode-testing-iconPassed);
    }

    .status-success::before {
      content: "🟢 ";
    }

    .status-failed {
      color: var(--vscode-testing-iconFailed);
    }

    .status-failed::before {
      content: "🔴 ";
    }

    .status-terminated {
      color: var(--vscode-debugConsole-warningForeground);
    }

    .status-terminated::before {
      content: "🟠 ";
    }

    .time {
      white-space: nowrap;
    }

    /* ── Metrics hint on history rows ───────────────────────── */
    .metrics-hint {
      font-size: 0.8em;
      color: var(--vscode-descriptionForeground);
      white-space: nowrap;
    }

    /* ── Statistics cards ───────────────────────────────────── */
    #stats-panel,
    #dashboard-panel {
      padding: 8px;
    }

    .stats-empty {
      padding: 20px;
      text-align: center;
      color: var(--vscode-descriptionForeground);
    }

    .task-card {
      border: 1px solid var(--vscode-panel-border);
      border-radius: 4px;
      margin-bottom: 8px;
      background-color: var(--vscode-sideBar-background);
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background-color: var(--vscode-editorGroupHeader-tabsBackground);
      border-bottom: 1px solid var(--vscode-panel-border);
      gap: 8px;
    }

    .card-title {
      font-weight: 600;
      font-size: 0.9em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .card-source {
      font-size: 0.8em;
      color: var(--vscode-descriptionForeground);
      white-space: nowrap;
    }

    .card-clear-btn {
      background: transparent;
      border: none;
      color: var(--vscode-descriptionForeground);
      cursor: pointer;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 0.85em;
      line-height: 1;
      flex-shrink: 0;
    }

    .card-clear-btn:hover {
      background-color: var(--vscode-list-hoverBackground);
      color: var(--vscode-foreground);
    }

    .card-body {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0;
    }

    .stat-cell {
      padding: 5px 10px;
      border-right: 1px solid var(--vscode-panel-border);
      border-bottom: 1px solid var(--vscode-panel-border);
    }

    .stat-cell:last-child {
      border-right: none;
    }

    .stat-label {
      font-size: 0.75em;
      color: var(--vscode-descriptionForeground);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .stat-value {
      font-size: 0.95em;
      font-weight: 600;
      margin-top: 1px;
    }

    .rate-high {
      color: var(--vscode-testing-iconPassed);
    }

    .rate-mid {
      color: var(--vscode-debugConsole-warningForeground);
    }

    .rate-low {
      color: var(--vscode-testing-iconFailed);
    }

    .streak-badge {
      display: inline-block;
      font-size: 0.75em;
      padding: 1px 5px;
      border-radius: 3px;
      margin-left: 4px;
      vertical-align: middle;
    }

    .streak-fail {
      background-color: var(--vscode-testing-iconFailed);
      color: var(--vscode-editor-background);
    }

    .trend-slower {
      color: var(--vscode-testing-iconFailed);
    }

    .trend-faster {
      color: var(--vscode-testing-iconPassed);
    }

    /* ── Exit code bar ──────────────────────────────────────── */
    .exit-bar {
      display: flex;
      height: 8px;
      border-radius: 3px;
      overflow: hidden;
      gap: 1px;
      margin-top: 4px;
    }

    .exit-seg {
      height: 100%;
      min-width: 2px;
      cursor: default;
    }

    .exit-seg-0 {
      background-color: var(--vscode-testing-iconPassed);
    }

    .exit-seg-other {
      background-color: var(--vscode-testing-iconFailed);
    }
  </style>
</head>

<body>
  <!-- Tab strip -->
  <div class="tab-strip">
    <button class="tab-btn active" id="tab-history">History</button>
    <button class="tab-btn" id="tab-stats">Statistics</button>
    <button class="tab-btn" id="tab-dashboard">Dashboard</button>
  </div>

  <!-- Summary bar (shown in both modes) -->
  <div class="summary-bar" id="summary-bar">
    <span class="summary-item"><span class="summary-label">Today:</span> <span class="summary-value" id="sum-today">—</span></span>
    <span class="summary-divider">|</span>
    <span class="summary-item"><span class="summary-label">All-time:</span> <span class="summary-value" id="sum-total">—</span></span>
    <span class="summary-divider">|</span>
    <span class="summary-item"><span class="summary-label">Success rate:</span> <span class="summary-value" id="sum-rate">—</span></span>
    <span class="summary-divider">|</span>
    <span class="summary-item"><span class="summary-label">Total time:</span> <span class="summary-value" id="sum-time">—</span></span>
  </div>

  <!-- History tab -->
  <div id="history-panel">
    <table id="task-history-table">
      <thead>
        <tr>
          <th data-key="status">Status</th>
          <th data-key="type">Type</th>
          <th data-key="task">Task</th>
          <th data-key="source">Source</th>
          <th data-key="timestampRaw">Timestamp</th>
          <th data-key="exitCode">Exit Code</th>
          <th data-key="durationRaw">Execution Time</th>
          <th>Metrics</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <!-- Statistics tab -->
  <div id="stats-panel" style="display:none;"></div>

  <!-- Dashboard tab (stub — charts rendered in Phase 3) -->
  <div id="dashboard-panel" style="display:none;"></div>

  <script nonce="{{nonce}}">
    const vscode = acquireVsCodeApi();

    // Restore persisted UI state (survives webview recreation)
    const savedState = vscode.getState() || {};
    let historyData = [];
    let metricsData = {};
    let currentTab = savedState.tab || 'history';
    let sortKey = savedState.sortKey || null;
    let sortDirection = savedState.sortDir || 1;

    // Apply restored tab on startup
    applyTab(currentTab);

    // ── Tab wiring (use addEventListener, not onclick — CSP blocks inline handlers) ──
    document.getElementById('tab-history').addEventListener('click', () => switchTab('history'));
    document.getElementById('tab-stats').addEventListener('click', () => switchTab('stats'));
    document.getElementById('tab-dashboard').addEventListener('click', () => switchTab('dashboard'));

    // ── Sort header wiring ────────────────────────────────────
    document.querySelectorAll('th[data-key]').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.getAttribute('data-key');
        if (sortKey === key) {
          sortDirection *= -1;
        } else {
          sortKey = key;
          sortDirection = 1;
        }
        saveState();
        renderTable();
      });
    });

    // ── Message handler ──────────────────────────────────────
    window.addEventListener('message', event => {
      const message = event.data;
      if (message.command === 'loadData') {
        historyData = message.data.history || [];
        metricsData = message.data.metrics || {};
        renderSummary();
        if (currentTab === 'history') {
          renderTable();
        } else if (currentTab === 'stats') {
          renderStats();
        } else if (currentTab === 'dashboard') {
          renderDashboard();
        }
      }
    });

    // ── State persistence ─────────────────────────────────────
    function saveState() {
      vscode.setState({ tab: currentTab, sortKey, sortDir: sortDirection });
    }

    // ── Tab switching ─────────────────────────────────────────
    function switchTab(tab) {
      currentTab = tab;
      saveState();
      applyTab(tab);
      if (tab === 'history') {
        renderTable();
      } else if (tab === 'stats') {
        renderStats();
      } else if (tab === 'dashboard') {
        renderDashboard();
      }
    }

    function applyTab(tab) {
      document.getElementById('tab-history').classList.toggle('active', tab === 'history');
      document.getElementById('tab-stats').classList.toggle('active', tab === 'stats');
      document.getElementById('tab-dashboard').classList.toggle('active', tab === 'dashboard');
      document.getElementById('history-panel').style.display = tab === 'history' ? '' : 'none';
      document.getElementById('stats-panel').style.display = tab === 'stats' ? '' : 'none';
      document.getElementById('dashboard-panel').style.display = tab === 'dashboard' ? '' : 'none';
    }

    // ── Summary bar ───────────────────────────────────────────
    function renderSummary() {
      const allMetrics = Object.values(metricsData);

      const todayStart = new Date();
      todayStart.setHours(0, 0, 0, 0);
      const todayMs = todayStart.getTime();

      let todayRuns = 0;
      historyData.forEach(r => {
        if (r.timestampRaw >= todayMs) { todayRuns++; }
      });

      const totalRuns = allMetrics.reduce((s, m) => s + (m.totalExecutions || 0), 0);
      const totalSuccess = allMetrics.reduce((s, m) => s + (m.successfulExecutions || 0), 0);
      const totalTime = allMetrics.reduce((s, m) => s + (m.totalDurationMs || 0), 0);
      const overallRate = totalRuns > 0 ? Math.round((totalSuccess / totalRuns) * 100) : undefined;

      document.getElementById('sum-today').textContent = String(todayRuns);
      document.getElementById('sum-total').textContent = String(totalRuns);
      document.getElementById('sum-rate').textContent = overallRate !== undefined ? `${overallRate}%` : '—';
      document.getElementById('sum-time').textContent = formatDuration(totalTime || undefined);
    }

    // ── History table ─────────────────────────────────────────
    function renderTable() {
      document.querySelectorAll('th').forEach(th => {
        th.classList.remove('sort-asc', 'sort-desc');
        if (th.getAttribute('data-key') === sortKey) {
          th.classList.add(sortDirection === 1 ? 'sort-asc' : 'sort-desc');
        }
      });

      const sortedData = [...historyData].sort((a, b) => {
        if (!sortKey) { return 0; }
        let valA = a[sortKey];
        let valB = b[sortKey];
        if (valA === undefined || valA === null) { valA = ''; }
        if (valB === undefined || valB === null) { valB = ''; }
        if (valA < valB) { return -1 * sortDirection; }
        if (valA > valB) { return 1 * sortDirection; }
        return 0;
      });

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      sortedData.forEach(row => {
        const tr = document.createElement('tr');

        const tdStatus = document.createElement('td');
        tdStatus.textContent = row.status;
        tdStatus.className = `status-${row.status.toLowerCase()}`;
        tr.appendChild(tdStatus);

        const tdType = document.createElement('td');
        tdType.textContent = row.type;
        tr.appendChild(tdType);

        const tdTask = document.createElement('td');
        tdTask.textContent = row.task;
        tr.appendChild(tdTask);

        const tdSource = document.createElement('td');
        tdSource.textContent = row.source;
        tr.appendChild(tdSource);

        const tdTimestamp = document.createElement('td');
        tdTimestamp.textContent = row.timestamp;
        tdTimestamp.classList.add('time');
        tr.appendChild(tdTimestamp);

        const tdExit = document.createElement('td');
        tdExit.textContent = row.exitCode !== undefined && row.exitCode !== null ? row.exitCode : '';
        tr.appendChild(tdExit);

        const tdTime = document.createElement('td');
        tdTime.textContent = row.executionTime || '';
        tdTime.classList.add('time');
        tr.appendChild(tdTime);

        // Metrics hint column — built via DOM (no innerHTML) to avoid XSS
        const tdMetrics = document.createElement('td');
        const m = metricsData[row.metricsKey];
        if (m && m.totalExecutions > 0) {
          const span = document.createElement('span');
          span.className = 'metrics-hint';
          const avgStr = formatDuration(m.avgDurationMs);
          if (avgStr && avgStr !== '—') {
            span.append(`avg ${avgStr}`);
          }
          if (Number(m.consecutiveFailures) >= 3) {
            const badge = document.createElement('span');
            badge.className = 'streak-badge streak-fail';
            badge.textContent = `✗${Number(m.consecutiveFailures)}`;
            span.appendChild(badge);
          }
          tdMetrics.appendChild(span);
        }
        tr.appendChild(tdMetrics);

        tbody.appendChild(tr);
      });
    }

    // ── Statistics panel ──────────────────────────────────────
    function renderStats() {
      const panel = document.getElementById('stats-panel');
      const entries = Object.entries(metricsData);

      if (entries.length === 0) {
        panel.innerHTML = '';
        const empty = document.createElement('div');
        empty.className = 'stats-empty';
        empty.textContent = 'No metrics collected yet. Run some tasks to see statistics.';
        panel.appendChild(empty);
        return;
      }

      // Sort cards by totalExecutions desc
      entries.sort((a, b) => (b[1].totalExecutions || 0) - (a[1].totalExecutions || 0));

      panel.innerHTML = '';
      entries.forEach(([key, m]) => {
        panel.appendChild(buildTaskCard(key, m));
      });
    }

    function buildTaskCard(key, m) {
      const parts = key.split(':');
      const taskName = parts.slice(1, -1).join(':') || key;
      const taskSource = parts[0] || '';
      const taskScope = parts[parts.length - 1] || '';

      const card = document.createElement('div');
      card.className = 'task-card';

      // Header
      const header = document.createElement('div');
      header.className = 'card-header';

      const title = document.createElement('div');
      title.className = 'card-title';
      title.textContent = taskName;
      title.title = key;
      header.appendChild(title);

      const sourceSpan = document.createElement('span');
      sourceSpan.className = 'card-source';
      sourceSpan.textContent = taskSource ? `${taskSource} · ${taskScope}` : taskScope;
      header.appendChild(sourceSpan);

      const clearBtn = document.createElement('button');
      clearBtn.className = 'card-clear-btn';
      clearBtn.title = 'Clear metrics for this task';
      clearBtn.textContent = '✕';
      clearBtn.addEventListener('click', () => {
        vscode.postMessage({ command: 'clearMetrics', taskId: key });
      });
      header.appendChild(clearBtn);
      card.appendChild(header);

      // Body grid
      const body = document.createElement('div');
      body.className = 'card-body';

      // Success rate
      body.appendChild(makeStatCell('Success Rate', () => {
        if (m.successRate === undefined) { return { text: '—' }; }
        const cls = m.successRate >= 80 ? 'rate-high' : m.successRate >= 50 ? 'rate-mid' : 'rate-low';
        return { text: `${Math.round(m.successRate)}%`, cls };
      }));

      // Total runs
      body.appendChild(makeStatCell('Total Runs', () => ({ text: String(m.totalExecutions || 0) })));

      // Avg duration
      body.appendChild(makeStatCell('Avg Duration', () => ({ text: formatDuration(m.avgDurationMs) })));

      // Min / Max
      body.appendChild(makeStatCell('Min / Max', () => ({
        text: `${formatDuration(m.minDurationMs)} / ${formatDuration(m.maxDurationMs)}`
      })));

      // p95 duration
      body.appendChild(makeStatCell('p95 Duration', () => ({ text: formatDuration(m.p95DurationMs) })));

      // Last run
      body.appendChild(makeStatCell('Last Run', () => ({
        text: m.lastRunAt ? new Date(m.lastRunAt).toLocaleString() : '—'
      })));

      // Streak
      body.appendChild(makeStatCell('Streak', () => {
        if (Number(m.consecutiveFailures) >= 3) {
          return { text: `✗ ${Number(m.consecutiveFailures)} failures`, cls: 'rate-low' };
        }
        if (Number(m.consecutiveSuccesses) > 1) {
          return { text: `✓ ${Number(m.consecutiveSuccesses)} successes`, cls: 'rate-high' };
        }
        return { text: '—' };
      }));

      // Peak hour
      body.appendChild(makeStatCell('Peak Hour', () => ({
        text: m.peakHour !== undefined ? `${m.peakHour}:00–${m.peakHour}:59` : '—'
      })));

      // Duration trend
      body.appendChild(makeStatCell('Trend', () => {
        if (m.durationTrend === undefined) { return { text: '—' }; }
        if (m.durationTrend > 0) { return { text: '↑ slower', cls: 'trend-slower' }; }
        if (m.durationTrend < 0) { return { text: '↓ faster', cls: 'trend-faster' }; }
        return { text: '→ stable' };
      }));

      // Exit code histogram
      const exitCell = document.createElement('div');
      exitCell.className = 'stat-cell';
      const exitLabel = document.createElement('div');
      exitLabel.className = 'stat-label';
      exitLabel.textContent = 'Exit Codes';
      exitCell.appendChild(exitLabel);

      const exitCounts = m.exitCodeCounts || {};
      const exitEntries = Object.entries(exitCounts);
      if (exitEntries.length > 0) {
        const total = exitEntries.reduce((s, e) => s + Number(e[1]), 0);
        const bar = document.createElement('div');
        bar.className = 'exit-bar';
        exitEntries
          .sort((a, b) => Number(b[1]) - Number(a[1]))
          .forEach(([code, count]) => {
            const seg = document.createElement('div');
            seg.className = `exit-seg ${code === '0' ? 'exit-seg-0' : 'exit-seg-other'}`;
            seg.style.flexGrow = String(Number(count) / total);
            // Use textContent via title (safe, no innerHTML)
            seg.title = `Exit ${String(code)}: ${Number(count)}`;
            bar.appendChild(seg);
          });
        const exitValue = document.createElement('div');
        exitValue.className = 'stat-value';
        exitValue.textContent = m.mostCommonExitCode !== undefined ? `most: ${m.mostCommonExitCode}` : '—';
        exitCell.appendChild(exitValue);
        exitCell.appendChild(bar);
      } else {
        const exitValue = document.createElement('div');
        exitValue.className = 'stat-value';
        exitValue.textContent = '—';
        exitCell.appendChild(exitValue);
      }
      body.appendChild(exitCell);

      card.appendChild(body);
      return card;
    }

    function makeStatCell(label, valueFn) {
      const cell = document.createElement('div');
      cell.className = 'stat-cell';
      const l = document.createElement('div');
      l.className = 'stat-label';
      l.textContent = label;
      const v = document.createElement('div');
      v.className = 'stat-value';
      const { text, cls } = valueFn();
      v.textContent = text || '—';
      if (cls) { v.classList.add(cls); }
      cell.appendChild(l);
      cell.appendChild(v);
      return cell;
    }

    // ── Dashboard (stub — charts rendered in Phase 3) ──────────
    function renderDashboard() {
      const panel = document.getElementById('dashboard-panel');
      // Verify Chart.js loaded without CSP errors
      if (typeof Chart === 'undefined') {
        panel.textContent = 'Chart.js failed to load.';
        return;
      }
      const allMetrics = Object.values(metricsData);
      if (allMetrics.length === 0) {
        panel.textContent = 'No metrics collected yet. Run some tasks to see the dashboard.';
        return;
      }
      panel.textContent = `Dashboard ready — Chart.js ${Chart.version} loaded. Charts coming in Phase 3.`;
    }

    // ── Helpers ───────────────────────────────────────────────
    function formatDuration(ms) {
      if (ms === undefined || ms === null) { return '—'; }
      const n = Number(ms);
      if (n < 1000) { return `${Math.round(n)}ms`; }
      if (n < 60000) { return `${(n / 1000).toFixed(2)}s`; }
      const mins = Math.floor(n / 60000);
      const secs = Math.round((n % 60000) / 1000);
      return `${mins}m ${secs}s`;
    }
  </script>
</body>

</html>
