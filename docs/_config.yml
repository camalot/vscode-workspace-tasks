---
remote_theme: just-the-docs/just-the-docs

title: Workspace Tasks
description: A powerful Visual Studio Code extension that automatically discovers, organizes, and runs tasks from your workspace.
url: "https://camalot.github.io"
baseurl: "/vscode-workspace-tasks"
logo: /assets/images/icon.svg

github_username: camalot
github_repo: vscode-workspace-tasks

# Build settings
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - rouge

highlighter: rouge

# kramdown:
#   input: GFM
#   syntax_highlighter: rouge

# Theme configuration

search_enabled: true
search:
  heading_level: 2
  previews: 3

nav_sort: case_insensitive

color_scheme: dracula

# Footer links
footer_content: >
  <a href="https://marketplace.visualstudio.com/items?itemName=darthminos.workspace-tasks">
    Visual Studio Marketplace
  </a> &bull;
  <a href="https://open-vsx.org/extension/darthminos/workspace-tasks">
    Open VSX Registry
  </a> &bull;
  <a href="https://github.com/camalot/vscode-workspace-tasks/issues">
    Report an Issue
  </a>

# Aux links (top nav)
aux_links:
  "Marketplace":
    - "https://marketplace.visualstudio.com/items?itemName=darthminos.workspace-tasks"
  "Open VSX":
    - "https://open-vsx.org/extension/darthminos/workspace-tasks"
  "GitHub":
    - "https://github.com/camalot/vscode-workspace-tasks"

aux_links_new_tab: true

# Back to top link — replaced by custom FAB button (see _includes/footer_custom.html)
back_to_top: false

# Callouts
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Exclude from build
exclude:
  - _plans/
  - Gemfile
  - Gemfile.lock
  - node_modules/
